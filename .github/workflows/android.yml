name: Build Android APK

# Produces a debug APK you can install directly on a phone.
#
# Run it from the Actions tab with "Run workflow", or just push to main.
# When it finishes, download the artifact named pdf2mobi-apk.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # These are the packages python-for-android's libffi recipe needs.
          # Quoting pythonforandroid/recipes/libffi/__init__.py:
          #   - automake    for the `aclocal` binary
          #   - autoconf    for the `autoreconf` binary
          #   - libltdl-dev which defines the LT_SYS_SYMBOL_USCORE macro
          # libtool is also needed because libffi runs ./autogen.sh, which calls
          # `libtoolize`. On Ubuntu 24.04 the `libtool` package no longer ships
          # the `libtool` binary itself - that moved to `libtool-bin` - so both
          # packages are installed.
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config m4 \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Verify the autotools chain is complete
        run: |
          set -e
          autoconf --version | head -1
          automake --version | head -1
          libtool --version | head -1
          libtoolize --version | head -1
          aclocal --version | head -1
          # LT_SYS_SYMBOL_USCORE is defined by libltdl-dev's ltdl.m4, not by
          # libtool.m4, so search every installed aclocal macro.
          if grep -rqs LT_SYS_SYMBOL_USCORE /usr/share/aclocal/; then
            echo "LT_SYS_SYMBOL_USCORE found in the installed aclocal macros: OK"
          else
            echo "ERROR: LT_SYS_SYMBOL_USCORE missing from /usr/share/aclocal"
            ls -la /usr/share/aclocal/ || true
            exit 1
          fi

      - name: Install buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython<3.0"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache the Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: android-sdk-ndk-${{ hashFiles('buildozer.spec') }}
          restore-keys: android-sdk-ndk-

      - name: Verify the pure-Python core before building
        run: |
          python -m pip install pypdf
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          # Importing proves there is no accidental native dependency, which is
          # the whole reason this app can be built with python-for-android.
          from pdf2mobi_android import pdftext, builder, writers, encoding_fix
          print("core modules import cleanly")
          PY

      - name: Confirm the spec accepts the Android SDK licence
        run: |
          # buildozer only auto-answers sdkmanager's "Accept? (y/N)" prompt when
          # this is true. Without it, platform-tools and build-tools are skipped
          # and the build later fails with "Aidl not found".
          if grep -Eq '^[[:space:]]*android\.accept_sdk_license[[:space:]]*=[[:space:]]*(True|1|yes|on)' buildozer.spec; then
            echo "android.accept_sdk_license is enabled: OK"
          else
            echo "ERROR: android.accept_sdk_license is missing or not true in buildozer.spec"
            exit 1
          fi

      - name: Build the debug APK
        run: |
          # Non-interactive: buildozer answers the SDK licence prompt itself
          # (see android.accept_sdk_license above). Do not pipe through `yes`,
          # which can close the pipe early and abort the build.
          buildozer -v android debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf2mobi-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/*.log
            bin/*.log
          if-no-files-found: ignore
          retention-days: 7
